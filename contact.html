<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تواصل معنا - تطبيق مهنتي</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>تطبيق مهنتي</h1>
      <nav>
        <a href="services.html">الخدمات</a>
        <a href="about.html">عن التطبيق</a>
        <a href="contact.html" class="active">تواصل معنا</a>
        <a href="index.html" class="logout-btn">خروج</a>
      </nav>
    </header>

    <div class="main-content">
      <h2>تواصل معنا</h2>
      <div class="contact-card">
        <p>
          سعداء برؤيتك! يمكنك التواصل مع فريق الدعم الفني عبر الوسائل التالية:
        </p>
        <div class="container">


      <form id="contact" action="contact.php" method="post">
        <div class="form-group">
          <label for="username">اسم المستخدم:</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="أدخل اسم المستخدم"
            required
          />
        </div>

        <div class="form-group">
          <label for="gmail">البريد الالكتروني :</label>
          <input
            type="gmail"
            id="gmail"
            name="gmail"
            placeholder=" example@gmail.com "
            required
          />
        </div>
        <div class="form-group">
          <label for="phone"> رقم الهاتف:</label>
          <input
            type="phone"
            id="phone"
            name="phone"
            placeholder="أدخل رقم الهاتف"
            required
          />
        </div>

        <div class="form-group">
              <label for="subject">الموضوع</label>
              <select id="subject" name="subject" required>
                <option value=""> اختر الموضوع </option>
                <option value="question">استفسار</option>
                <option value="resource">اضافة مهنة</option>
                <option value="event">الاستفسار عن الوظاىف</option>
                <option value="project">المقترحات</option>
                <option value="other">الرجوع</option>
              </select>
              <p class="field-error" id="subject-error" hidden></p>
            </div>

             <div class="form-group">
              <label for="message">  المحتوى</label>
              <textarea
                id="message"
                name="message"
                rows="6"
                required
                minlength="10"
                maxlength="2000"
              ></textarea>
              <p class="field-error" id="message-error" hidden></p>
            </div>

        <button type="submit" class="btn"> ارسال</button>
      </form>
        <div class="phone-box">
          <span>📞 رقم الهاتف:</span>
          <a href="tel:+0903841811" class="phone-link">249903841811+</a>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
